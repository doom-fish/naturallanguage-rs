[package]
name = "naturallanguage"
version = "0.4.2"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/naturallanguage-rs"
repository = "https://github.com/doom-fish/naturallanguage-rs"
description = "Safe Rust bindings for Apple's NaturalLanguage framework — language detection, tokenization, tagging, embeddings, gazetteers, and custom models on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["nlp", "macos", "language", "tokenizer", "apple"]
categories = ["api-bindings", "os::macos-apis", "text-processing"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "naturallanguage"
crate-type = ["lib"]

[features]
default = [
    "language_detection",
    "tokenize",
    "tag",
    "embedding",
    "gazetteer",
    "model",
    "contextual_embedding",
]
language_detection = []
tokenize = []
tag = ["tokenize"]
embedding = []
gazetteer = []
model = []
contextual_embedding = ["embedding"]

[dependencies]

[dev-dependencies]
regex-lite = "0.1"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_detect_language"
required-features = ["language_detection"]

[[example]]
name = "02_tokenize"
required-features = ["tokenize"]

[[example]]
name = "03_named_entities"
required-features = ["tag"]

[profile.release]
debug = "full"
strip = "none"

[[example]]
name = "04_embedding"
required-features = ["embedding"]

[[example]]
name = "05_tagger"
required-features = ["tag"]

[[example]]
name = "06_gazetteer"
required-features = ["tag", "gazetteer"]

[[example]]
name = "07_model"
required-features = ["model"]

[[example]]
name = "08_contextual_embedding"
required-features = ["contextual_embedding"]
